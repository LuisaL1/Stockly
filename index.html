    <!-- La página pública viene prerenderizada dentro de #root. Si la persona ya inició sesión
         o abre otra ruta de la app, se oculta mientras carga la app (evita un parpadeo). -->
    <script>
      (function () {
        try {
          var conSesion = Object.keys(localStorage).some(function (k) {
            return /^sb-.*-auth-token$/.test(k);
          });
          if (location.pathname !== "/" || conSesion) document.documentElement.className += " app";
        } catch (e) {
          if (location.pathname !== "/") document.documentElement.className += " app";
        }
      })();
    </script>
    <style>
      html.app #root > [data-landing] { display: none; }
    </style>
